services:
  - type: web
    name: beginnercodes-levelup
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOWED_CORS_ORIGINS
        value: '["https://www.beginnercodes.online","https://beginnercodes.online"]'
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: beginnercodes-db
          property: connectionString

databases:
  - name: beginnercodes-db
    plan: free
